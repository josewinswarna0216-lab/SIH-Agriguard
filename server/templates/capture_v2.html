<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriGuard — Multi-Crop Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12180F; --surface: #1A2216; --surface-2: #212B1B;
    --ink: #ECF2E6; --ink-soft: #AAB8A2; --ink-faint: #76846F; --line: #2B3624;
    --good: #6FCB86; --urgent: #F0796A; --water: #6FB3E8; --beta: #C9A24B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Source Sans 3", -apple-system, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 18px 16px 32px;
  }
  .beta-tag {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
    color: var(--beta); background: rgba(201,162,75,0.12); border: 1px solid rgba(201,162,75,0.35);
    padding: 4px 10px; border-radius: 100px; margin-bottom: 8px;
  }
  h1 { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 19px; margin: 0 0 2px; }
  .sub { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 14px; text-align: center; max-width: 480px; }

  .video-wrap {
    position: relative; width: min(480px, 100%); aspect-ratio: 4/3; background: #000;
    border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rec-tag {
    position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 6px;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
    background: rgba(0,0,0,0.6); color: #fff; padding: 5px 10px; border-radius: 100px;
  }
  .rec-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
  .rec-dot.active { background: var(--urgent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
  .flash.on { opacity: 0.35; }

  .controls { width: min(480px, 100%); margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .field input, .field select {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; padding: 9px 12px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
  }
  .source-toggle { display: flex; gap: 8px; }
  .source-toggle button {
    flex: 1; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 500;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; color: var(--ink-soft);
    padding: 9px 10px; cursor: pointer;
  }
  .source-toggle button.active { background: var(--water); color: #0E1A24; border-color: var(--water); font-weight: 700; }
  .btn-row { display: flex; gap: 10px; }
  button {
    flex: 1; font-family: "Manrope", sans-serif; font-weight: 700; font-size: 14px;
    border: none; border-radius: 10px; padding: 13px; cursor: pointer;
  }
  #startBtn { background: var(--good); color: #10160E; }
  #stopBtn { background: var(--urgent); color: #fff; }
  button:disabled { opacity: 0.4; cursor: default; }

  .status-card {
    width: min(480px, 100%); margin-top: 14px; background: var(--surface); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow); border: 1px solid var(--line); font-size: 13px;
  }
  .status-line { display: flex; justify-content: space-between; color: var(--ink-soft); }
  .status-line + .status-line { margin-top: 6px; }
  .status-line strong { color: var(--ink); }
  .healthy-text { color: var(--good); }
  .diseased-text { color: var(--urgent); }

  a.live-link {
    margin-top: 14px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--water);
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="beta-tag">MULTI-CROP SPECIALIST MODEL</div>
<h1>Multi-Crop Capture</h1>
<div class="sub">Trained on Banana, Betel, Citrus, Corn, Cotton, Mango and Sugarcane only. Use the live camera, or play a video file right here and stream frames from that instead.</div>

<div class="video-wrap">
  <span class="rec-tag"><span class="rec-dot" id="recDot"></span><span id="recLabel">STANDBY</span></span>
  <video id="video" autoplay playsinline muted></video>
  <img id="photoPreview" style="width:100%;height:100%;object-fit:cover;display:none;" alt="Selected photo">
  <div class="flash" id="flash"></div>
</div>
<canvas id="canvas" style="display:none;"></canvas>

<div class="controls">
  <div class="field">
    <label>Source</label>
    <div class="source-toggle">
      <button type="button" id="sourceCameraBtn" class="active">Camera</button>
      <button type="button" id="sourceVideoBtn">Play Video File</button>
      <button type="button" id="sourcePhotoBtn">Upload Photo</button>
    </div>
  </div>
  <div class="field" id="videoFileField" style="display:none;">
    <label>Video File</label>
    <input type="file" id="videoFileInput" accept="video/*">
  </div>
  <div class="field" id="photoFileField" style="display:none;">
    <label>Photo</label>
    <input type="file" id="photoFileInput" accept="image/*">
  </div>
  <div class="field">
    <label>Position Label</label>
    <input type="text" id="positionInput" value="Mango Tree 1" placeholder="e.g. Mango Tree 1">
  </div>
  <div class="field">
    <label>Capture Interval</label>
    <select id="intervalSelect">
      <option value="1500">Every 1.5s</option>
      <option value="2000" selected>Every 2s</option>
      <option value="3000">Every 3s</option>
      <option value="5000">Every 5s</option>
    </select>
  </div>
  <div class="btn-row">
    <button id="startBtn">&#9654; Start Streaming</button>
    <button id="stopBtn" disabled>&#9632; Stop</button>
  </div>
</div>

<div class="status-card" id="statusCard">
  <div class="status-line"><span>Status</span><strong id="statusText">Camera not started</strong></div>
</div>

<a class="live-link" href="/live-v2" target="_blank">Open the Multi-Crop Live Feed page &#8594;</a>

<script>
(function () {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const flash = document.getElementById("flash");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const recDot = document.getElementById("recDot");
  const recLabel = document.getElementById("recLabel");
  const positionInput = document.getElementById("positionInput");
  const intervalSelect = document.getElementById("intervalSelect");
  const statusCard = document.getElementById("statusCard");
  const sourceCameraBtn = document.getElementById("sourceCameraBtn");
  const sourceVideoBtn = document.getElementById("sourceVideoBtn");
  const sourcePhotoBtn = document.getElementById("sourcePhotoBtn");
  const videoFileField = document.getElementById("videoFileField");
  const videoFileInput = document.getElementById("videoFileInput");
  const photoFileField = document.getElementById("photoFileField");
  const photoFileInput = document.getElementById("photoFileInput");
  const photoPreview = document.getElementById("photoPreview");

  let stream = null;
  let timer = null;
  let previewTimer = null;
  let frameCount = 0;
  let sourceMode = "camera";
  let objectUrl = null;
  const PREVIEW_INTERVAL_MS = 250;

  // On some mobile browsers, drawing a fast setInterval-driven canvas capture
  // from a <video> element can silently return a stale, previously-decoded
  // frame even though the video itself has kept playing -- the on-screen
  // position label (driven by video.currentTime) moves on, but the image
  // actually sent to the AI doesn't, so it looks like the model is "stuck"
  // on one answer. requestVideoFrameCallback fires exactly when the browser
  // has a genuinely new decoded frame ready, so capturing inside it (instead
  // of blindly on a timer) guarantees every capture matches what's on screen.
  let streaming = false;
  const rvfcSupported = typeof video.requestVideoFrameCallback === "function";
  let lastCaptureTime = 0;

  function scheduleFrameCallback(intervalMs) {
    video.requestVideoFrameCallback((now) => {
      if (!streaming) return;
      if (now - lastCaptureTime >= intervalMs) {
        lastCaptureTime = now;
        captureAndSend();
      }
      scheduleFrameCallback(intervalMs);
    });
  }

  function setSourceMode(mode) {
    sourceMode = mode;
    sourceCameraBtn.classList.toggle("active", mode === "camera");
    sourceVideoBtn.classList.toggle("active", mode === "video");
    sourcePhotoBtn.classList.toggle("active", mode === "photo");
    videoFileField.style.display = mode === "video" ? "flex" : "none";
    photoFileField.style.display = mode === "photo" ? "flex" : "none";
    video.style.display = mode === "photo" ? "none" : "block";
    photoPreview.style.display = mode === "photo" ? "block" : "none";
    startBtn.textContent = mode === "photo" ? "▶ Test Photo" : "▶ Start Streaming";
  }
  sourceCameraBtn.addEventListener("click", () => setSourceMode("camera"));
  sourceVideoBtn.addEventListener("click", () => setSourceMode("video"));
  sourcePhotoBtn.addEventListener("click", () => setSourceMode("photo"));
  photoFileInput.addEventListener("change", () => {
    const file = photoFileInput.files[0];
    if (!file) return;
    photoPreview.src = URL.createObjectURL(file);
    // Auto-fill Position from the filename so each test result is labeled
    // with what was actually tested, instead of leaving whatever was typed
    // in for a previous photo.
    const name = file.name.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
    positionInput.value = name;
  });

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
    } catch (err) {
      statusCard.innerHTML = '<div class="status-line"><span>Error</span><strong class="diseased-text">' + err.message + '</strong></div>';
      throw err;
    }
  }

  async function startVideoFile() {
    const file = videoFileInput.files[0];
    if (!file) {
      const err = new Error("Choose a video file first");
      statusCard.innerHTML = '<div class="status-line"><span>Error</span><strong class="diseased-text">' + err.message + '</strong></div>';
      throw err;
    }
    objectUrl = URL.createObjectURL(file);
    video.srcObject = null;
    video.src = objectUrl;
    video.loop = true;
    video.muted = true;
    await new Promise((resolve, reject) => {
      video.onloadedmetadata = () => video.play().then(resolve).catch(reject);
      video.onerror = () => reject(new Error("Could not play that video file"));
    });
  }

  function stopSource() {
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
    video.pause();
    if (objectUrl) {
      URL.revokeObjectURL(objectUrl);
      objectUrl = null;
    }
    video.removeAttribute("src");
    video.srcObject = null;
    video.load();
  }

  // Matches the backend's MISSION_ROWS / MISSION_TREES_PER_ROW grid so
  // simulated positions actually land on the Flight Plan map.
  const MISSION_ROWS = 5;
  const MISSION_TREES_PER_ROW = 3;
  function simulatedPosition(n) {
    const idx = n % (MISSION_ROWS * MISSION_TREES_PER_ROW);
    const row = Math.floor(idx / MISSION_TREES_PER_ROW) + 1;
    const tree = (idx % MISSION_TREES_PER_ROW) + 1;
    return `Row ${row} - Tree ${tree}`;
  }

  // Specific to AgriGuard_TestSamples.mp4's own layout (21 images, 3
  // seconds each, in this exact order) -- lets the simulated position
  // include which crop is actually on screen. A different video won't
  // match this sequence, so the name portion is only meaningful for that
  // specific test file.
  const VIDEO_SECONDS_PER_IMAGE = 3;
  const VIDEO_CROP_SEQUENCE = [
    "Banana", "Banana", "Banana",
    "Betel", "Betel", "Betel",
    "Citrus", "Citrus", "Citrus",
    "Corn", "Corn", "Corn",
    "Cotton", "Cotton", "Cotton",
    "Mango", "Mango", "Mango",
    "Sugarcane", "Sugarcane", "Sugarcane",
  ];
  function currentCropName() {
    const imgIdx = Math.floor(video.currentTime / VIDEO_SECONDS_PER_IMAGE) % VIDEO_CROP_SEQUENCE.length;
    return VIDEO_CROP_SEQUENCE[imgIdx] || "Field";
  }

  function captureAndSend() {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    flash.classList.add("on");
    setTimeout(() => flash.classList.remove("on"), 150);

    // Video mode simulates a drone moving through the grid, one new
    // position per frame -- Camera mode keeps using whatever's typed in,
    // since that's meant to track where the phone actually physically is.
    const position = sourceMode === "video"
      ? `${currentCropName()} ${simulatedPosition(frameCount)}`
      : (positionInput.value || "unknown");
    if (sourceMode === "video") positionInput.value = position;

    canvas.toBlob(async (blob) => {
      if (!blob) return;
      frameCount += 1;
      const formData = new FormData();
      formData.append("image", blob, "capture.jpg");
      formData.append("position", position);

      try {
        const res = await fetch("/predict-v2", { method: "POST", body: formData });
        const data = await res.json();
        const healthyClass = data.is_healthy ? "healthy-text" : "diseased-text";
        statusCard.innerHTML =
          '<div class="status-line"><span>Frame</span><strong>#' + frameCount + '</strong></div>' +
          '<div class="status-line"><span>Result</span><strong class="' + healthyClass + '">' + data.label_display + '</strong></div>' +
          '<div class="status-line"><span>Confidence</span><strong>' + (data.confidence * 100).toFixed(1) + '%</strong></div>' +
          '<div class="status-line"><span>Next pass</span><strong>' + data.recommended_action_label + '</strong></div>';
      } catch (err) {
        statusCard.innerHTML = '<div class="status-line"><span>Error</span><strong class="diseased-text">' + err.message + '</strong></div>';
      }
    }, "image/jpeg", 0.85);
  }

  function sendPreviewFrame() {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => {
      if (!blob) return;
      const formData = new FormData();
      formData.append("image", blob, "preview.jpg");
      fetch("/stream-frame-v2", { method: "POST", body: formData }).catch(() => {});
    }, "image/jpeg", 0.6);
  }

  async function testPhotoOnce() {
    const file = photoFileInput.files[0];
    if (!file) {
      statusCard.innerHTML = '<div class="status-line"><span>Error</span><strong class="diseased-text">Choose a photo first</strong></div>';
      return;
    }
    frameCount += 1;
    const formData = new FormData();
    formData.append("image", file, file.name);
    formData.append("position", positionInput.value || "unknown");
    try {
      const res = await fetch("/predict-v2", { method: "POST", body: formData });
      const data = await res.json();
      const healthyClass = data.is_healthy ? "healthy-text" : "diseased-text";
      statusCard.innerHTML =
        '<div class="status-line"><span>Frame</span><strong>#' + frameCount + '</strong></div>' +
        '<div class="status-line"><span>Result</span><strong class="' + healthyClass + '">' + data.label_display + '</strong></div>' +
        '<div class="status-line"><span>Confidence</span><strong>' + (data.confidence * 100).toFixed(1) + '%</strong></div>' +
        '<div class="status-line"><span>Next pass</span><strong>' + data.recommended_action_label + '</strong></div>';
    } catch (err) {
      statusCard.innerHTML = '<div class="status-line"><span>Error</span><strong class="diseased-text">' + err.message + '</strong></div>';
    }
  }

  startBtn.addEventListener("click", async () => {
    if (sourceMode === "photo") {
      await testPhotoOnce();
      return;
    }
    startBtn.disabled = true;
    try {
      if (sourceMode === "video") {
        await startVideoFile();
      } else {
        await startCamera();
      }
    } catch (err) {
      startBtn.disabled = false;
      return;
    }
    stopBtn.disabled = false;
    sourceCameraBtn.disabled = true;
    sourceVideoBtn.disabled = true;
    sourcePhotoBtn.disabled = true;
    videoFileInput.disabled = true;
    recDot.classList.add("active");
    recLabel.textContent = "STREAMING";
    frameCount = 0;
    const interval = parseInt(intervalSelect.value, 10);
    streaming = true;
    if (rvfcSupported) {
      lastCaptureTime = 0;
      scheduleFrameCallback(interval);
    } else {
      timer = setInterval(captureAndSend, interval);
    }
    previewTimer = setInterval(sendPreviewFrame, PREVIEW_INTERVAL_MS);
  });

  stopBtn.addEventListener("click", () => {
    streaming = false;
    clearInterval(timer);
    clearInterval(previewTimer);
    stopSource();
    startBtn.disabled = false;
    stopBtn.disabled = true;
    sourceCameraBtn.disabled = false;
    sourceVideoBtn.disabled = false;
    sourcePhotoBtn.disabled = false;
    videoFileInput.disabled = false;
    recDot.classList.remove("active");
    recLabel.textContent = "STANDBY";
  });
})();
</script>

</body>
</html>
